<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terrário</title>
  <link rel="stylesheet" href="garden.css" />
  <style>
    :root{--bg:#f4f1eb;--card:#fffdf8;--ink:#25211d;--muted:#7d7469;--line:#ded6ca;--soft:#eee7dc;--accent:#8f3d2e;--accent2:#c58a68;--done:#55765b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;overflow:hidden}header{position:relative;z-index:10;height:94px;backdrop-filter:blur(18px);background:rgba(244,241,235,.86);border-bottom:1px solid rgba(222,214,202,.75)}.topbar{width:min(1120px,calc(100% - 32px));height:100%;margin:0 auto;display:flex;align-items:center}.brand-row{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}.menu-button{width:42px;height:42px;border-radius:14px;border:1px solid rgba(222,214,202,.95);background:rgba(255,253,248,.72);color:var(--ink);display:grid;place-items:center;cursor:pointer}.menu-button svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}h1{margin:0;font-size:clamp(1.1rem,2.2vw,1.75rem);letter-spacing:-.04em;line-height:1}.subtitle{margin-top:6px;color:var(--muted);font-size:.88rem}.drawer-backdrop{position:fixed;inset:0;z-index:19;background:rgba(37,33,29,.18);opacity:0;pointer-events:none;transition:opacity .18s}.drawer{position:fixed;z-index:20;top:0;left:0;height:100vh;width:min(340px,calc(100vw - 28px));padding:22px;background:rgba(255,253,248,.97);border-right:1px solid rgba(222,214,202,.94);box-shadow:18px 0 50px rgba(37,33,29,.12);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;gap:20px}body.drawer-open .drawer{transform:translateX(0)}body.drawer-open .drawer-backdrop{opacity:1;pointer-events:auto}.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}.drawer-title{margin:0;border:0;padding:0;background:transparent;color:inherit;cursor:pointer;text-align:left;font:inherit;font-size:1.55rem;font-weight:700;letter-spacing:-.055em}.drawer-close{width:36px;height:36px;border-radius:12px;border:1px solid rgba(222,214,202,.95);background:transparent;color:var(--muted);cursor:pointer;font-size:1.2rem}.drawer-section-title{color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;font-weight:850}.project-list{display:grid;gap:10px}.project-card{display:block;width:100%;border:1px solid rgba(222,214,202,.9);border-radius:20px;background:rgba(244,241,235,.52);padding:14px;text-align:left;text-decoration:none;color:var(--ink);cursor:pointer}.project-card.active{border-color:rgba(143,61,46,.28);background:linear-gradient(135deg,rgba(143,61,46,.08),rgba(197,138,104,.08)),rgba(255,253,248,.85)}.project-card.placeholder{cursor:default;opacity:.68}.project-name{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em}.project-name:before{content:"";width:8px;height:8px;border-radius:999px;background:var(--done);box-shadow:0 0 0 4px rgba(85,118,91,.1)}.placeholder .project-name:before{background:#b7aa9a;box-shadow:0 0 0 4px rgba(183,170,154,.12)}.project-meta{margin:7px 0 0 17px;color:var(--muted);font-size:.82rem}.drawer-foot{margin-top:auto;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);padding-top:16px}.terrario-home{display:grid}.project-frame{display:none;width:100%;height:calc(100vh - 94px);border:0;background:var(--bg)}body.project-mode .terrario-home{display:none}body.project-mode .project-frame{display:block}@media(max-width:780px){header{height:122px}.project-frame{height:calc(100vh - 122px)}}
  </style>
</head>
<body>
  <header><div class="topbar"><div class="brand-row"><button class="menu-button" id="openDrawer" aria-label="Abrir Terrário" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></button><div><h1 id="projectTitle">Terrário</h1><div class="subtitle" id="projectSubtitle"></div></div></div></div></header>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="terrarioDrawer"><div class="drawer-head"><button class="drawer-title" id="homeProject" type="button">Terrário</button><button class="drawer-close" id="closeDrawer" aria-label="Fechar Terrário">×</button></div><div><div class="drawer-section-title">Mudas</div><div class="project-list"><button class="project-card" data-project="novela" data-url="novela.html"><div class="project-name">Novela Vertical</div><div class="project-meta">plano de desenvolvimento</div></button><button class="project-card" data-project="voltinha" data-url="https://alanferreiras-web.github.io/voltinha/"><div class="project-name">Voltinha</div><div class="project-meta">radar editorial</div></button><a class="project-card" href="https://alanferreiras-web.github.io/bancafeiras/" target="_blank" rel="noopener"><div class="project-name">Banca</div><div class="project-meta">abrir em nova aba ↗</div></a><button class="project-card placeholder" aria-disabled="true"><div class="project-name">Nova muda</div><div class="project-meta">em breve</div></button></div></div><div class="drawer-foot">v1.6</div></aside>
  <div class="terrario-home" aria-label="Jardim de projetos"></div>
  <iframe class="project-frame" id="projectFrame" title="Projeto" loading="lazy"></iframe>
  <script>
    const open=document.getElementById('openDrawer'),close=document.getElementById('closeDrawer'),back=document.getElementById('drawerBackdrop'),frame=document.getElementById('projectFrame'),title=document.getElementById('projectTitle'),subtitle=document.getElementById('projectSubtitle');
    function openDrawer(){document.body.classList.add('drawer-open');open.setAttribute('aria-expanded','true')}
    function closeDrawer(){document.body.classList.remove('drawer-open');open.setAttribute('aria-expanded','false')}
    function showHome(){document.body.classList.remove('project-mode');document.querySelectorAll('.project-card[data-project]').forEach(x=>x.classList.remove('active'));title.textContent='Terrário';subtitle.textContent='';document.title='Terrário';closeDrawer()}
    function showProject(button){const project=button.dataset.project;document.body.classList.add('project-mode');document.querySelectorAll('.project-card[data-project]').forEach(x=>x.classList.toggle('active',x===button));title.textContent=button.querySelector('.project-name').textContent.trim();subtitle.textContent=project==='voltinha'?'Radar editorial de tendências':'Plano de desenvolvimento — checklist leve';document.title='Terrário — '+title.textContent;if(frame.dataset.project!==project){frame.dataset.project=project;frame.src=button.dataset.url}closeDrawer()}
    frame.addEventListener('load',()=>{if(frame.dataset.project!=='novela')return;try{const win=frame.contentWindow,doc=frame.contentDocument;if(typeof win.showProject==='function')win.showProject('novela');doc.querySelectorAll('header,.drawer,.drawer-backdrop,.terrario-home,footer,.project-frame').forEach(el=>el.style.display='none');doc.body.classList.remove('home-mode','voltinha-mode','drawer-open');doc.querySelector('main').style.display='block'}catch(e){}});
    open.onclick=openDrawer;close.onclick=closeDrawer;back.onclick=closeDrawer;document.getElementById('homeProject').onclick=showHome;document.querySelectorAll('.project-card[data-project]').forEach(button=>button.onclick=()=>showProject(button));document.querySelectorAll('.project-card[target="_blank"]').forEach(link=>link.addEventListener('click',closeDrawer));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
  </script>
  <script src="garden.js"></script>
</body>
</html>
